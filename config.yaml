# ===========================================================================
# Claude Chart Bot - Konfiguration
# ===========================================================================
# Alle Schwellenwerte sind hier konfigurierbar. Secrets stehen ausschliesslich
# in der .env (siehe .env.example) und tauchen in dieser Datei nicht auf.
# ===========================================================================

market:
  # Produkt-Symbol (Root). Welcher Kontrakt tatsaechlich laeuft, entscheidet
  # das Chart in NinjaTrader - die Bridge meldet den Namen mit (z.B.
  # "MNQ 12-25"), er wird uebernommen und nicht nachgerechnet.
  # Die Ideen-Protokollierung laeuft ausschliesslich auf diesem Symbol,
  # andere Instrumente holt der MCP-Server auf Abruf.
  product: MNQ

  # Ohne Wirkung, seit die Kontraktaufloesung beim Chart liegt. Bleibt als
  # Feld erhalten, damit bestehende Konfigurationen nicht brechen.
  contract_override: null

  # Kerzengroesse in Minuten (1 oder 5 sind sinnvoll fuer NQ-Intraday).
  candle_interval_minutes: 1

  # Puffergroessen aus der Zeit des Live-Bots. Sie werden von keinem
  # laufenden Prozess mehr ausgewertet - der MCP-Server holt seine Kerzen
  # ueber DEFAULT_BAR_COUNTS, die Ideen-Protokollierung ueber ideas.bars.
  #
  # Die Zusicherung dahinter gilt weiter, ist aber umgezogen: Vortageshoch
  # und -tief brauchen die komplette Vorsession PLUS die laufende. Geprueft
  # wird das jetzt an "ideas.bars" (siehe Config.validate) - ist der Wert zu
  # klein, bleiben die Vortagesmarken NaN und pdh_pdl_bruch loest NIE aus,
  # ohne Fehlermeldung.
  candle_buffer_size: 3000
  warmup_bars: 2880

  # Kontraktspezifikation (fuer Backtest-P&L und die USD-Angaben der Ideen).
  # MUSS zum Eintrag in common/instruments.py passen - Config.validate()
  # prueft das beim Start und bricht sonst mit klarer Meldung ab. Sonst
  # waeren saemtliche USD-Angaben um den Faktor zwischen Mini und Micro
  # daneben, ohne dass es irgendwo auffiele.
  #   MNQ = 0.25 / 2.0    (Tick 0.50 USD)
  #   NQ  = 0.25 / 20.0   (Tick 5.00 USD)
  #   MGC = 0.10 / 10.0   (Tick 1.00 USD)
  tick_size: 0.25
  point_value: 2.0

  session:
    # Zeitzone der Boersensession.
    timezone: America/New_York
    # CME-Globex-Sessionstart. Alles ab dieser Uhrzeit zaehlt zum
    # Handelstag des Folgetages (Standard fuer Index-Futures).
    start_time: "18:00"
    # Sessionende (nur informativ / fuer Reports).
    end_time: "17:00"

# ---------------------------------------------------------------------------
# Indikatoren
# ---------------------------------------------------------------------------
indicators:
  rsi_period: 14
  sma_fast: 20
  sma_slow: 50
  atr_period: 14

  # Konsolidierungs-/Flaggen-Heuristik.
  # Idee: kraeftige Bewegung (Impuls), danach enge Range (Flagge),
  # dann Ausbruch aus der Range in Impulsrichtung.
  flag:
    # Anzahl Kerzen, ueber die der vorausgehende Impuls gemessen wird.
    impulse_lookback: 20
    # Impuls muss mindestens so viele ATR gross sein.
    impulse_min_atr: 2.5
    # Anzahl Kerzen der Konsolidierungsphase.
    consolidation_lookback: 10

    # Range der Konsolidierung darf hoechstens so viele ATR betragen.
    #
    # VORLAEUFIGER STARTWERT, aus Daten abgeleitet - KEINE getestete
    # Trading-Entscheidung. Jederzeit hier aenderbar.
    #
    # Der fruehere Wert 1.2 konnte NIE ausloesen: die schmalste
    # Konsolidierung ueber 850 echte MNQ-5m-Kerzen hatte Range/ATR = 1.37,
    # der Median lag bei 2.92. Das Setup stand als aktiv in der Config und
    # lieferte garantiert nichts.
    #
    # 2.40 ist das 25. Perzentil der gemessenen Verteilung: das engste
    # Viertel der Konsolidierungen gilt als "eng". Gemessen ueber 107 Tage
    # (12871 Kerzen); beide Datenquellen stimmen auf 0.07 ueberein
    # (MNQ p25 = 2.47, CFD p25 = 2.40 - genommen wurde der niedrigere,
    # also selektivere Wert aus der groesseren Stichprobe).
    #
    # Ergibt rund 7 Ausbrueche je Woche, also gut 5 Wochen bis zu Laurins
    # Schwelle von 20 Ideen je Richtung.
    #
    # Laurin hat das Setzen DIESES Werts ausdruecklich genehmigt ("hab da
    # auch keine Ahnung"). Das ist eine Ausnahme - andere Setup-Parameter
    # bleiben rueckfragepflichtig. Details in CODE_CHAT_KONTEXT.md 8.17.
    consolidation_max_atr: 2.40
    # Ausbruch zaehlt erst ab diesem Puffer (in ATR) ueber/unter der Range.
    breakout_buffer_atr: 0.1
# ---------------------------------------------------------------------------
# Struktur- und Zonenanalyse (fliesst in get_market_snapshot ein)
# ---------------------------------------------------------------------------
# Hiess bis zum 22.08.2026 "on_demand" - benannt nach dem /analyse-Kommando
# des Telegram-Bots, den es nicht mehr gibt. Die Felder jener Schleife
# (Poll-Timeouts, Cooldown, Tageslimit) sind mit ihm entfallen; geblieben
# ist, was mcp_server/snapshot.py tatsaechlich auswertet.
analyse:
  # Swing-Erkennung fuer Unterstuetzung/Widerstand
  swing_strength: 3          # Kerzen links/rechts, die ein Extrem bestaetigen
  swing_lookback: 120        # Fenster, in dem nach Swings gesucht wird
  max_zones: 3               # maximale Anzahl Zonen je Seite
  zone_merge_atr: 0.5        # Swings naeher als X*ATR werden zusammengefasst

  # Trend-Einschaetzung
  trend_slope_lookback: 10        # ueber wie viele Kerzen die SMA20-Steigung misst
  trend_flat_threshold_atr: 0.02  # darunter gilt die Steigung als flach

# ---------------------------------------------------------------------------
# NinjaTrader-Bruecke (Datenquelle)
# ---------------------------------------------------------------------------
# Der Indikator ClaudeBridge.cs schickt abgeschlossene Kerzen hierher.
# Dieser SQLite-Speicher ist zugleich der Bar-Cache: er waechst im Betrieb
# und schaltet damit nach und nach die Felder unter "historienabhaengig"
# im Snapshot frei.
ntbridge:
  enabled: true

  # NUR lokal gebunden. Von aussen nicht erreichbar, auch nicht im LAN.
  host: "127.0.0.1"
  port: 8787

  database: "data/ntbridge.sqlite3"

  # Juengster Bar aelter als stale_factor * Bar-Laenge -> im Snapshot als
  # veraltet markiert. Waehrend der Handelszeit heisst das fast immer:
  # NinjaTrader laeuft nicht oder das Chart wurde geschlossen.
  stale_factor: 2.0

  # Nur noetig, wenn NinjaTrader/Lucid abweichende Instrumentnamen liefert.
  # Beispiel:  symbol_map: { "MNQ": "MNQ" }
  symbol_map: {}

# ---------------------------------------------------------------------------
# Regelbasierte Ideen-Protokollierung (Etappe C)
# ---------------------------------------------------------------------------
# Protokolliert im Hintergrund, WANN eine Setup-Bedingung erfuellt war -
# mit Einstieg, Stop, Ziel und CRV aus den Daten bis genau diesem Moment.
# Keine Order, keine Empfehlung: Datengrundlage fuer die spaetere Frage,
# welche Setups tatsaechlich einen Erwartungswert haben.
ideas:
  enabled: true

  # In welcher TATSAECHLICHEN Kontoumgebung die Idee entstanden ist.
  # Reine Dokumentation der Herkunft, KEIN Steuerungsfeld.
  #
  # Die tragende Unterscheidung (Spezifikation Abschnitt 4):
  #   profil  = was tatsaechlich war   -> steht an der Idee
  #   rules   = was gewesen waere      -> Parameter von evaluate_past_ideas
  # Deshalb rechnet evaluate_past_ideas(rules="both") spaeter ALLE Ideen
  # durch BEIDE Regelwerke, unabhaengig vom profil. Nur so laesst sich die
  # eigentliche Frage beantworten, welche Setups auch unter Prop-Firm-Regeln
  # tragen. Als optionaler Filter bleibt das Feld trotzdem abrufbar.
  #
  # Der Wert heisst "sim_frei" und nicht "demo", weil diese Datei bis zum
  # 22.08.2026 unter "tradovate:" ein "environment: demo" fuehrte und beides
  # verwechselbar war. Der Abschnitt ist mit dem Legacy-Pfad entfallen, der
  # eigene Wertebereich bleibt: er benennt die Kontoumgebung praeziser.
  profil: sim_frei

  # Erlaubter Wertebereich. Ein Tippfehler im Profil wuerde die spaetere
  # Auswertung still in zwei Gruppen zerlegen, ohne dass es auffiele -
  # deshalb wird beim Start dagegen geprueft statt frei zu akzeptieren.
  profile_erlaubt:
    - sim_frei          # eigenes NinjaTrader-Simulationskonto, keine Prop-Regeln
    - lucid_challenge   # laufende Lucid-Challenge
    - lucid_funded      # bestandene Lucid-Challenge, Sim-Funded

  # Eigene Datei, getrennt von den Kerzen. Der Kerzenspeicher wird im
  # laufenden Betrieb vom Empfaenger beschrieben.
  datenbank: "data/ideas.sqlite3"

  # Nur MNQ. Ein Mehr-Instrument-Stream ist ausdruecklich nicht Teil des
  # Projekts.
  instrumente: ["MNQ"]

  # Zeitebene der Erkennung und wie viele Kerzen dafuer geladen werden.
  timeframe: "5m"
  bars: 1500

  # CRV darunter -> Idee wird als "unter Schwelle" markiert, aber trotzdem
  # protokolliert. Wegzulassen hiesse, den Datensatz zugunsten der eigenen
  # Erwartung zu beschneiden.
  crv_schwelle: 1.5

  # Auch von Filtern abgelehnte Ideen speichern. Empfohlen: sonst laesst
  # sich spaeter weder pruefen, ob ein Filter zu scharf steht, noch die
  # Frage beantworten, wie viele Ideen ein Regelwerk verhindert haette.
  speichere_gefilterte: true

  # Unter dieser Zahl gilt eine Kategorie in der Auswertung (Etappe D) als
  # "zu wenig Daten".
  min_ideen_pro_kategorie: 20

  # Schwellenwerte je Setup-Familie. Die Schluessel entsprechen
  # ideas/setups.py::SETUP_BIBLIOTHEK; jede Familie bildet auf eine
  # Strategie aus backtest/strategies/library.py ab. Fehlt eine Familie
  # hier, gelten die Vorgabewerte aus IdeenSetupParameter.
  #
  # stop_atr/ziel_atr sind ATR-Vielfache ab Einstieg - dieselbe Bedeutung
  # wie stop_loss_atr/take_profit_atr in der Backtest-Engine, damit
  # Protokoll und Backtest dasselbe rechnen.
  setups:
    pdh_pdl_bruch:
      aktiv: true
      puffer_punkte: 1.0
      stop_atr: 1.5
      ziel_atr: 3.0

    ib_bruch:
      aktiv: true
      puffer_punkte: 1.0
      stop_atr: 1.5
      ziel_atr: 3.0

    vwap_reversion:
      aktiv: true
      abweichung_atr: 1.5     # so weit war der Kurs vom VWAP entfernt
      stop_atr: 1.5
      ziel_atr: 2.0

    flaggen_ausbruch:
      aktiv: true
      stop_atr: 1.2
      ziel_atr: 2.5

  filter:
    # Fortsetzungs-Setups (Bruch, Flagge) brauchen Trend,
    # Reversion braucht Range.
    adx_aktiv: true
    adx_trend_min: 20.0
    adx_range_max: 25.0

    # Nur in liquiden Phasen; duenne Mittagszone blockiert.
    liquiditaet_aktiv: true
    duennzone_aktiv: true

    # Blackout um Wirtschaftstermine. Ist der Kalender nicht erreichbar,
    # wird die Idee NICHT stillschweigend durchgewinkt, sondern mit dem
    # Grund "blackout_nicht_pruefbar" markiert - ein Ausfall darf nie wie
    # Entwarnung aussehen.
    blackout_aktiv: true

    # Wie weit zurueck der Kalender ueberhaupt Auskunft geben kann.
    # Forex Factory liefert im Wesentlichen die laufende Woche. Fragt man
    # einen drei Wochen alten Zeitpunkt ab, findet sich dort kein Termin
    # und die Antwort waere "kein Blackout" - eine Entwarnung aus einer
    # Wissensluecke heraus. Jenseits dieser Grenze bleibt die Frage offen.
    #
    # Praktische Folge: den Protokollierungslauf regelmaessig laufen
    # lassen, nicht einmal im Monat aufholen.
    blackout_max_alter_tage: 7.0

# ---------------------------------------------------------------------------
# Wirtschaftskalender (MCP-Tool get_event_risk)
# ---------------------------------------------------------------------------
event_risk:
  enabled: true

  # Nur diese Waehrungen und Impact-Stufen werden beruecksichtigt.
  currencies: ["USD"]
  impacts: ["High"]

  # Blackout-Fenster um einen hochwirksamen Termin herum.
  blackout_minutes_before: 15
  blackout_minutes_after: 15

  # Caching. Termine aendern sich nicht im Minutentakt, FRED noch seltener.
  schedule_cache_minutes: 30
  actual_cache_hours: 6

  upcoming_limit: 8

  # Terminliste: Forex Factory (inoffizieller Wochenfeed, kein Key noetig).
  # Liefert Impact, Minutengenauigkeit, Forecast und Previous - aber KEIN
  # Actual. Die tatsaechlichen Werte kommen aus FRED (FRED_API_KEY in .env).
  forex_factory_url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json"

# ---------------------------------------------------------------------------
# Makro-Vintages fuer die Research-Engine (FRED/ALFRED) - seit 25.08.2026.
# Getrennt von event_risk oben: das speist den Live-Snapshot, dieses hier
# die persistierte, revisionsfeste Historie fuer Backtests. Siehe macro/.
# ---------------------------------------------------------------------------
macro:
  enabled: true
  datenbank: "data/macro.sqlite3"

  # Leer = die kuratierte Vorgabemenge aus macro/provider.py::STANDARD_SERIEN
  # wird verwendet. Eigene Reihen-IDs stammen von https://fred.stlouisfed.org
  serien: {}

  # Kalendername fuer common/marktkalender.py (pandas_market_calendars).
  # CME_Equity ist der richtige Kalender fuer CME-Index-Futures (MNQ/MES/
  # ES/NQ) - empirisch gegen die installierte Bibliothek geprueft
  # (schliesst 25.12./1.1. korrekt aus, zeigt 24.12. korrekt als
  # Fruehschluss). ANDERE CME-Kalender (Agriculture/Rate/...) haben andere
  # Feiertage und waeren hier falsch.
  marktkalender: "CME_Equity"

  # Kuratierte Impact-Einstufung je Reihe (High/Medium/Low) - eigene
  # fachliche Einordnung, KEINE externe Messung oder Kalenderquelle. Grund:
  # es gibt keine verlaessliche Gratis-Quelle fuer Forecast UND Impact
  # zusammen (Trading Economics kostenpflichtig, ForexFactory-Scraping
  # widerspricht der "kein fragiles Scraping"-Regel) - die Impact-Stufe
  # selbst aendert sich aber nicht wie ein Forecast-Wert, deshalb hier fest
  # eingetragen statt offengelassen. Siehe CODE_CHAT_KONTEXT.md 31.10.
  # Erlaubt: "High", "Medium", "Low" - Config.validate() bricht sonst ab.
  wichtigkeit:
    CPIAUCSL: High     # VPI
    CPILFESL: High     # Kern-VPI
    PCEPILFE: High     # Kern-PCE, von der Fed bevorzugtes Inflationsmass
    PAYEMS: High        # Non-Farm Payrolls
    PPIACO: Medium     # EPI
    PPILFE: Medium     # Kern-EPI
    RSAFS: Medium      # Einzelhandelsumsaetze
    ICSA: Medium       # Erstantraege Arbeitslosenhilfe (woechentlich)

  # Kalenderanbieter fuer echte Wirtschaftstermine (z.B. Trading Economics) -
  # ABSICHTLICH NICHT ueber diese Datei konfigurierbar. Ein Anbieter wird
  # ausschliesslich ueber die Umgebungsvariable ECONOMIC_CALENDAR_PROVIDER
  # eingehaengt (siehe .env.example). Stand 25.08.2026 ist keiner
  # implementiert: Trading Economics ist final verworfen (~22 USD/Monat,
  # abgelehnt), ForexFactory-Scraping widerspricht der Scraping-Regel.
  # Forecast/Consensus-Werte bleiben deshalb bis auf Weiteres unbefuellt -
  # siehe macro/provider.py::EconomicCalendarProvider und
  # CODE_CHAT_KONTEXT.md 31.10.

logging:
  level: INFO
  directory: logs
  # Menschenlesbares Log
  text_file: bot.log
  # Strukturiertes Log (eine JSON-Zeile pro Event) - fuer spaetere Auswertung
  json_file: events.jsonl
  max_bytes: 10485760   # 10 MB
  backup_count: 5
  console: true

# ---------------------------------------------------------------------------
# Backtesting
# ---------------------------------------------------------------------------
backtest:
  # Datenquelle. Seit dem 22.08.2026 nur noch "csv" - der
  # Tradovate-Provider ist mit dem Legacy-Pfad entfallen.
  provider: csv
  csv:
    directory: data
  output_directory: backtest_results

  # -------------------------------------------------------------------------
  # HANDELSKOSTEN - benannte Profile statt einer Pauschale
  # -------------------------------------------------------------------------
  # Bis zum 23.08.2026 stand hier eine einzige Zahl (2.50). Sie verdeckte drei
  # Dinge, die sich voellig unterschiedlich verhalten: verhandelbare
  # Broker-Kommission, NICHT verhandelbare Boersen-/Clearing-/NFA-Gebuehren,
  # und Slippage - die gar keine Gebuehr ist, sondern Ausfuehrungsqualitaet.
  #
  # Warum das zaehlt: die Basisvermessung ergab bei prev_day_breakout 5,00 USD
  # Kosten je Trade gegen 2,00 USD Bruttoverlust. Die Kostenannahme dominierte
  # das Ergebnis.
  #
  # Dasselbe Setup laesst sich unter jedem Profil rechnen, ohne die Strategie
  # oder die Research-Logik anzufassen.
  kostenprofil: private_ninjatrader

  kostenprofile:
    private_ninjatrader:
      beschreibung: >-
        MNQ ueber das NinjaTrader-Free-Modell auf Laurins privatem Konto.
        Enthaelt Broker-Kommission sowie Boersen-, Clearing- und
        NFA-Gebuehren.
      summe_je_seite: 0.95        # USD, entspricht ~1.90 Round Turn
      slippage_ticks_je_seite: 1.0
      ist_annahme: false
      quelle: "Laurin, 23.08.2026 - NinjaTrader-Free-Modell"
      # Die Aufteilung ist NICHT belegt, deshalb bleiben die Einzelposten
      # leer. Erfundene Posten, die zufaellig richtig aufsummieren, saehen
      # aus wie eine Recherche - eine ehrliche Luecke ist besser.
      # Sobald eine Abrechnung vorliegt, hier eintragen; die Summe muss dann
      # passen, sonst bricht Kostenprofil.__post_init__ ab.
      broker_kommission_je_seite: null
      boerse_je_seite: null
      clearing_je_seite: null
      nfa_je_seite: null

    lucid:
      beschreibung: >-
        MNQ unter einer Lucid-Prop-Firm-Struktur.
      summe_je_seite: 0.50        # USD, entspricht 1.00 Round Turn
      slippage_ticks_je_seite: 1.0
      ist_annahme: true           # NICHT gegen eine Abrechnung geprueft
      quelle: >-
        Arbeitsannahme Laurin, 23.08.2026 - extern nicht verifiziert,
        vor Gebrauch gegen die Lucid-Konditionen pruefen
      broker_kommission_je_seite: null
      boerse_je_seite: null
      clearing_je_seite: null
      nfa_je_seite: null

    pauschale_alt:
      beschreibung: >-
        Die pauschale Altannahme. Nur zum Nachrechnen aelterer Ergebnisse
        wie der Basisvermessung vom 23.08.2026 - fuer neue Laeufe ungeeignet.
      summe_je_seite: 2.50
      slippage_ticks_je_seite: 1.0
      ist_annahme: true
      quelle: "Altbestand ohne Herkunftsangabe, vermutlich Platzhalter"
      broker_kommission_je_seite: null
      boerse_je_seite: null
      clearing_je_seite: null
      nfa_je_seite: null

  # In-Sample / Out-of-Sample Aufteilung.
  # Optimieren ist NUR auf in_sample erlaubt; das Framework verweigert
  # Parametersuchen auf dem Out-of-Sample-Zeitraum.
  split:
    mode: fraction        # "fraction" oder "date"
    in_sample_fraction: 0.7
    # Nur bei mode: date relevant (ISO-Datum, exklusiv fuer OOS-Start)
    split_date: null
    # Nur fuer split_data_three_way (Research-Engine-Phase Validation, seit
    # 24.08.2026): Anteil des NACH in_sample_fraction verbleibenden Rests, der
    # zur Validation wird. Der Rest bleibt Out-of-Sample, weiterhin einmalig
    # fuer die Confirmation-Phase reserviert. 0.5 heisst: von den 30 % nach dem
    # 70-%-Trainingsschnitt werden 15 Prozentpunkte Validation, 15 bleiben OOS.
    validation_fraction: 0.5


# ===========================================================================
# AUSFUEHRUNG - autonomer Handel und Order-Panel
# ===========================================================================
#
# Bis zum 30.08.2026 war das Projekt read-only: es gab keinen Order-Endpunkt,
# und das war eine bewusste Entscheidung. Laurin hat sie am 30.08.2026
# aufgehoben - Ausfuehrung ueber NinjaTrader ist jetzt Projektbestandteil.
#
# Zwei Riegel bleiben, unabhaengig von allem hier:
#
#  1. Das NinjaScript-AddOn (TradayriBridge) handelt AUSSCHLIESSLICH auf
#     Konten mit Provider == Simulator. Dafuer gibt es dort keinen Schalter
#     und keinen Konfigurationseintrag - genau deshalb steht auch hier keiner.
#  2. ClaudeBridge.cs ist ein Indikator und kann strukturell keine Orders
#     platzieren. Der Datenweg bleibt damit vom Orderweg getrennt.
ausfuehrung:
  # Steuert NUR den autonomen Bot. Das Order-Panel der Oberflaeche arbeitet
  # unabhaengig davon weiter - ein abgeschalteter Bot ist keine gesperrte
  # Handelsoberflaeche.
  #
  # Scharfgeschaltet am 30.08.2026 auf Laurins Entscheidung hin
  # ("Autonom auf Sim101 handeln"). Was das bedeutet:
  #   - Der Bot prueft im Takt von takt_sekunden auf neue, UNGEFILTERTE
  #     Ideen aus der Ideen-Protokollierung.
  #   - Er handelt nur im Fenster handel_von..handel_bis (03:00-16:00 ET).
  #   - Er handelt nur auf einem Simulationskonto - das erzwingt das
  #     NinjaScript-AddOn, nicht diese Zeile.
  #   - Jede Entscheidung landet in data/execution.sqlite3, auch die
  #     gegen einen Trade.
  #
  # Abschalten: hier auf false setzen und die App neu starten.
  enabled: true

  # Welches Regelwerk gilt. Die Profile stehen in common/kontoregeln.py:
  #   frei              - Eigenkapital, keine Anbieterregeln
  #   lucid_pro_25k     - kein Tagesverlustlimit, 1.000 USD Gesamtverlust
  #   lucid_pro_50k     - 1.200 USD/Tag, 2.000 USD Gesamtverlust
  #   lucid_pro_100k    - 1.800 USD/Tag, 3.000 USD Gesamtverlust
  #   lucid_pro_150k    - 2.700 USD/Tag, 4.500 USD Gesamtverlust
  #   lucid_flex_50k / _100k / _150k - wie Pro, aber ohne Tagesverlustlimit
  #
  # ACHTUNG: Alle Lucid-Zahlen sind ANNAHMEN aus zwei Uebersichten Dritter
  # (30.08.2026). Lucids eigenes Hilfe-Center antwortet automatisierten
  # Abrufen mit HTTP 403. Wo die Quellen sich widersprachen, steht der
  # striktere Wert. Bestaetige sie aus deinem Dashboard und trage sie unter
  # "kontoprofile" ein - dann verschwindet der Annahme-Vermerk aus den
  # Berichten.
  # Vorgabe ist "frei" mit selbst gesetzten Grenzen (siehe kontoprofile
  # unten): auf Sim101 wird zunaechst Evidenz gesammelt, nicht eine
  # Challenge nachgespielt. Auf ein Lucid-Profil umstellen ist eine Zeile -
  # lies aber vorher den Befund unter risiko_je_trade_usd.
  kontoprofil: frei

  # Einzelne Werte eines Profils ueberschreiben. Eine Aenderung OHNE "quelle"
  # wird abgelehnt: eine Zahl ohne Herkunft ist im Protokoll wertlos.
  #
  # kontoprofile:
  #   lucid_pro_25k:
  #     max_verlust_usd: 1000.0
  #     quelle: "Lucid-Dashboard, abgelesen am TT.MM.2026"
  #     ist_annahme: false
  kontoprofile:
    frei:
      # Eigenkapital hat keine Anbieterregeln - aber "keine Regeln" ist kein
      # Zustand, in dem ein Bot laufen sollte. Diese Grenzen sind selbst
      # gesetzt und bewusst so gewaehlt, dass sie bei einem Risikobudget von
      # 150 USD je Trade nach 4 Verlusten den Tag und nach 12 den Betrieb
      # beenden.
      kontogroesse_usd: 25000.0
      max_verlust_usd: 1800.0
      drawdown_art: statisch
      tagesverlust_usd: 600.0
      quelle: "Selbst gesetzte Grenzen fuer den Sim-Datensammelbetrieb, 30.08.2026"
      ist_annahme: false

  # Kontostand, auf dem die Verlustgrenzen rechnen. null = Kontogroesse des
  # Profils. Beim freien Konto muss hier ein Wert stehen, sonst rechnen die
  # Kennzahlen gegen 0.
  startkapital_usd: null

  # Eigenes Kontraktlimit. Das Anbieterlimit ist das Maximum des ERLAUBTEN,
  # keine Empfehlung: 20 Micro-Kontrakte auf einem 25k-Konto sind formal
  # zulaessig und trotzdem unvernuenftig. Es gilt immer der kleinere Wert.
  max_kontrakte: 2

  # Was ein einzelner Trade kosten darf. null = aus risiko_je_trade_anteil
  # ableiten.
  #
  # NACHGEMESSEN AM 30.08.2026 - BITTE LESEN, BEVOR DU HIER DREHST
  # Die 42 Signale der aktiven Setups auf sieben Tagen MNQ-5m riskieren je
  # EINEM Micro-Kontrakt:
  #     min 50 | 25%% 83 | Median 119 | 75%% 138 | max 154 USD
  # Wie viele davon bei welchem Budget ueberhaupt handelbar sind:
  #      50 USD ->  1/42 (2%%)      150 USD -> 38/42 (90%%)
  #      70 USD ->  6/42 (14%%)     200 USD -> 42/42 (100%%)
  #     100 USD -> 14/42 (33%%)
  #
  # Und als Anteil des Lucid-Gesamtverlustpuffers, Median-Signal:
  #      25k -> 11,9%%      50k -> 6,0%%      100k -> 4,0%%      150k -> 2,7%%
  #
  # Das heisst im Klartext: die aktuellen 5m-Setups und ein Lucid-25k passen
  # nicht zusammen. Ein einziger Micro-Kontrakt - die kleinste Einheit, die es
  # gibt - riskiert dort ein Achtel des gesamten Spielraums. Mit einem
  # 7-Prozent-Budget waeren 14 Prozent der Signale handelbar, und die Auswahl
  # waere systematisch auf die ruhigsten verzerrt.
  #
  # 150 USD sind deshalb hier gesetzt: 90 Prozent der Signale sind handelbar,
  # und gegen die selbst gesetzten Grenzen oben sind das 12 Verluste bis zum
  # Stopp. Fuer ein echtes 25k-Prop-Konto waere dieselbe Zahl fahrlaessig.
  risiko_je_trade_usd: 150.0

  # Anteil der massgeblichen Bezugsgroesse je Trade.
  #
  # Bezug ist bei einem Prop-Konto der GESAMTVERLUSTPUFFER, nicht die
  # Kontogroesse. Bei einem 50k-Konto mit 2.000 USD Puffer waeren ein Prozent
  # von 50.000 (= 500 USD) ein Viertel des gesamten Spielraums - nach vier
  # Verlusttrades waere das Konto weg. Ein Prozent des Puffers sind 20 USD,
  # und das ist die Groessenordnung, die hier gemeint ist.
  #
  # Der Abstand zum Stop bestimmt daraus die Kontraktzahl, nicht umgekehrt:
  # ein enger Stop erlaubt mehr Kontrakte bei gleichem Risiko. Reicht das
  # Budget nicht fuer einen einzigen Kontrakt, wird NICHT aufgerundet - dann
  # ist der Trade zu teuer, und das ist eine Antwort.
  #
  # WARUM 7 PROZENT UND NICHT 1
  # Am 30.08.2026 auf den vorhandenen MNQ-Kerzen nachgemessen (1.987 5m-Kerzen):
  # der Median-ATR liegt bei 23,1 Punkten. Ein Stop von 1,5 ATR sind damit
  # 34,6 Punkte = 69,19 USD je EINEM Micro-Kontrakt.
  #
  # Auf einem Lucid-25k mit 1.000 USD Gesamtverlustpuffer riskiert ein
  # einzelner MNQ-Kontrakt also bereits rund 7 Prozent des gesamten
  # Spielraums - weniger ist mit einem Micro-Kontrakt nicht moeglich, es gibt
  # keine kleinere Einheit. Bei 1 Prozent wuerde der Bot schlicht nie handeln
  # und das saehe aus wie ein Defekt.
  #
  # Die Kehrseite gehoert dazu: rund 14 Verlusttrades in Folge beenden ein
  # 25k-Konto. Das ist keine Eigenschaft dieser Einstellung, sondern des
  # Verhaeltnisses von MNQ-Volatilitaet zu Lucids Puffer. Wer das nicht will,
  # braucht einen engeren Stop, einen groesseren Kontotyp oder einen
  # Timeframe mit kleinerem ATR - nicht eine kleinere Zahl an dieser Stelle.
  risiko_je_trade_anteil: 0.07

  # Handelsfenster in Boersenzeit (ET). 03:00 deckt die London-Eroeffnung ab,
  # 16:00 den US-Schluss. Ausserhalb ist der Nasdaq duenn; dort produziert ein
  # Bot vor allem schlechte Fuellungen.
  #
  # Das Fenster gilt fuer den EINSTIEG. Eine laufende Position wird nicht
  # angefasst - ihr Stop und ihr Ziel liegen als echte Orders bei NinjaTrader
  # und wirken auch dann, wenn hier nichts mehr laeuft.
  handel_von: "03:00"
  handel_bis: "16:00"
  handel_zeitzone: "America/New_York"
  nur_wochentags: true

  # NinjaTrader-Konto. Das AddOn laesst ohnehin nur Simulationskonten zu; der
  # Name steht hier, damit im Protokoll steht, WELCHES gehandelt wurde. Ohne
  # ausdruecklichen Namen lehnt das AddOn ab, sobald es mehr als einen
  # Kandidaten gibt (Sim101 und Backtest sind beide Simulator).
  konto: "Sim101"

  # Wie oft der Bot nach neuen Signalen sieht. Er arbeitet auf
  # Kerzenschluessen, nicht auf Ticks - haeufiger als der Kerzentakt bringt
  # nichts.
  takt_sekunden: 60

# ---------------------------------------------------------------------------
# Chartmuster
# ---------------------------------------------------------------------------
# VORLAEUFIG. Diese Schwellen stammen aus ZWEI Beispielen von Laurin
# (01.09. und 02.09.2026) und sind damit nicht kalibriert, sondern geraten.
# Sie werden gegen den Referenzsatz in data/w_referenz.sqlite3 geprueft
# (werkzeuge/w_referenz.py). Bis Laurin die Definition freigegeben hat, wird
# auf ihr NICHTS gemessen - der Fehler vom 02.09.2026 war, dreimal vor der
# Definition zu messen.
#
# Alle Toleranzen sind ANTEILE der Musterhoehe oder ATR-Vielfache. Eine
# Punktzahl waere an das Kursniveau von 2026 gebunden und an 2019 falsch.
patterns:
  doppelboden:
    strength: 6
    # Zweites Tief hoechstens so viel hoeher / tiefer als das erste.
    #
    # ACHTUNG, BEKANNTER KONFLIKT (03.09.2026): max_unter 0.15 verwirft
    # Laurins EIGENES W vom 02.09.2026 - dessen zweites Tief liegt 19,50
    # Punkte unter dem ersten, das sind 24 % der Hoehe am Ruecklauf. Der Wert
    # steht hier, weil Laurin ihn am 03.09. so vorgegeben hat; der Widerspruch
    # ist in docs/OFFENE_FRAGEN.md protokolliert und wird in AP3 gegen den
    # Referenzsatz entschieden. Festgehalten in
    # tests/test_muster_w.py::test_konflikt_max_unter_verwirft_laurins_w2.
    max_ueber: 0.15
    max_unter: 0.15
    # Fenster der Durchschnittslinie, Anteil der Musterdauer. Laurins
    # Kriterium lautet woertlich: "es heisst W, weil wenn man eine
    # Durchschnittslinie durchlegen wuerde, es aussieht wie ein W."
    glaettung: 0.12
    min_dauer: 10
    max_dauer: 200
    min_hoehe_atr: 2.0
    min_linker_arm: 0.5
    # Bestaetigung der Umkehr: Schlusskurs steigt um diesen Anteil der
    # Musterhoehe ueber das laufende Minimum. Bewusst KLEIN - ein kleiner
    # Wert erzeugt mehr Kandidaten je erstem Tief, und welcher davon die Form
    # trifft, entscheidet der Formfehler, nicht diese Schwelle.
    bestaetigung_anteil: 0.15
    max_kandidaten: 6
    # Aufwaertskerzen nach dem zweiten Tief, bevor die untere Linie als
    # bestaetigt gilt. Laurin am 03.09.2026: "fruehestens ab der zweiten
    # Kerze nach oben, da man da erst sieht, dass die erste erst ca. auf
    # selber Hoehe aufgehoert hat und der Chart wieder nach oben geht."
    min_aufwaerts_kerzen: 2
    # Schranke fuer den Formfehler. Fehlt bewusst: sie kommt aus der
    # Kalibrierung gegen den Referenzsatz (AP3). Solange sie fehlt, gibt der
    # Erkenner den Formfehler nur aus und filtert nicht.
    max_formfehler: null
